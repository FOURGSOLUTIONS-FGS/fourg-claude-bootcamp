AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Bucket S3 privado, versionado, encriptado.
  Equivalente al template Terraform en ../terraform/.

Parameters:

  ProjectName:
    Type: String
    Description: Nombre del proyecto (kebab-case)
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: kebab-case (lowercase, números y guiones)

  Environment:
    Type: String
    Description: Entorno
    Default: dev
    AllowedValues: [dev, staging, prod]

  Owner:
    Type: String
    Description: Tag Owner para auditoría
    Default: equipo

Resources:

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

Outputs:

  BucketName:
    Description: Nombre del bucket S3
    Value: !Ref Bucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: ARN del bucket
    Value: !GetAtt Bucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  BucketDomainName:
    Description: Domain name del bucket (acceso vía S3 API)
    Value: !GetAtt Bucket.DomainName
